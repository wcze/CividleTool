name: Sync Data and Build

on:
  schedule:
    - cron: '0 16 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-and-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync-data
        run: npm run sync-data

      - name: Run build
        run: npm run build

      - name: Commit and push generated changes
        shell: bash
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git fetch origin master
          git rebase origin/master

          git add ./src
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] auto-sync data and build"
          fi

          git add ./dist
          if ! git diff --cached --quiet; then
            build_time=$(TZ=Asia/Shanghai date '+%Y%m%d%H%M')
            git commit -m "[build] ${build_time}"
          fi

          if ! git diff --quiet origin/master...HEAD; then
            git push origin HEAD:master
          fi
