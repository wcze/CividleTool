name: Sync Data and Build

on:
  schedule:
    - cron: '0 16 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-and-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync-data
        run: npm run sync-data

      - name: Run build
        run: npm run build

      - name: Commit and push generated changes
        shell: bash
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # 先暂存本地生成的文件；没有变化时 git stash 不会创建 stash
          stash_created=false
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git stash push --include-untracked -m "sync-data generated changes"
            stash_created=true
          fi

          # 拉取并变基远程最新代码
          git fetch origin master
          git rebase origin/master

          # 仅在确实创建了 stash 时恢复
          if [ "$stash_created" = true ]; then
            git stash pop
          fi

          git add ./src
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] auto-sync data and build"
          fi

          git add ./dist
          if ! git diff --cached --quiet; then
            build_time=$(TZ=Asia/Shanghai date '+%Y%m%d%H%M')
            git commit -m "[build] ${build_time}"
          fi

          if ! git diff --quiet origin/master...HEAD; then
            git push origin HEAD:master
          fi
