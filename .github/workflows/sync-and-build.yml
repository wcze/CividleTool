name: Sync Data and Build

on:
  schedule:
    - cron: '0 16 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-and-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync-data
        run: npm run sync-data

      - name: Run build
        run: npm run build

      - name: Commit and push generated changes
        shell: bash
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "[data] [skip ci] auto-sync data and build"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
